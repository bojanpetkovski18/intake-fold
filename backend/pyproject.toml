[project]
name = "intakefold"
version = "0.1.0"
description = "Invoice and receipt intake with LLM extraction, validation rules and human review."
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.143.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pip-audit==2.10.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv]
# The two-week floor, applied to transitive packages as well as direct ones.
exclude-newer = "2026-10-17T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "DTZ", "PT", "RET", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
markers = ["integration: needs Docker for a real PostgreSQL"]
filterwarnings = ["error"]
