# Serves the production build and proxies /api. For nginx-unprivileged, which runs as a
# non-root user and so listens on 8080. M14 puts it in an image; M13 checks the headers.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Set here once: nginx drops server-level add_header lines in any location that adds its own.
    # style-src allows no inline styles; React sets style properties through the DOM, which a CSP
    # does not block. Page images come from the API on the same origin.
    set $csp "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    location /api/ {
        # The API sets its own headers, including a stricter CSP for JSON.
        proxy_pass http://api:8100;
        proxy_set_header Host $host;
        # Replaces any client value, and the API trusts it only from TRUSTED_PROXIES (D-042).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full batch: 25 files of up to 10 MiB, plus form overhead. The API checks each limit.
        client_max_body_size 260m;
    }

    location /assets/ {
        # File names carry a content hash, so they never change.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Client-side routes, such as /documents/<id>, all load the app.
        try_files $uri /index.html;
    }
}
